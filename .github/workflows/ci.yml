name: ci

on:
  push:
  pull_request:

# Least privilege: the job only checks out and builds.
permissions:
  contents: read

jobs:
  rust:
    # A same-repo PR is already covered by its branch's push event; only fork
    # PRs need the pull_request trigger.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      # Pinned to commit SHAs, not tags: a tag can be repointed, a SHA cannot.
      # Dependabot bumps a SHA and its version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
